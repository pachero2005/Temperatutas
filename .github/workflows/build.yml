name: Compilar Python a EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 📁 Descargar código del repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Instalar dependencias y PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 psutil wmi pyinstaller

    - name: ⚙️ Generar archivo Ejecutable (.exe)
      run: |
        pyinstaller --noconsole --onefile --name="MonitorHardware" main.py

    - name: 🚀 Subir el EXE como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: MonitorHardware-EXE
        path: dist/*.exe
